services:
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy

  # Runs the scheduled jobs (stale order release, token pruning).
  scheduler:
    build: .
    command: ["php", "artisan", "schedule:work"]
    volumes:
      - .:/var/www
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-hellobee}
      POSTGRES_USER: ${DB_USERNAME:-hellobee}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hellobee_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-hellobee}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
